<h1 class="title">Опис робіт субпідрядника</h1>

<p>Хоча це поле можна залишити порожнім, це може призвести до помилок у функціях комунікації, якщо існує кілька порожніх полів.</p>
<p>Тому ми наполегливо рекомендуємо завжди використовувати унікальний опис робіт.</p>
